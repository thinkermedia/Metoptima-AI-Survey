<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mineral Processing Technology & AI Survey | Thinker Media Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --paper:#F3F7FC;
    --blue-deep:#0A2E55;
    --blue:#1D5A9E;
    --blue-mid:#2E6FB8;
    --blue-soft:#EAF2FB;
    --blue-line:#CBDCEE;
    --ink:#152A44;
    --muted:#5C7089;
    --gold:#B8954A;
    --danger:#B14343;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:radial-gradient(circle at 20% 15%, #FFFFFF 0%, #EAF1FA 55%, #DDE9F6 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{ width:100%; max-width:680px; }
  .brandbar{ display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .brand{ font-family:'Crimson Text',serif; font-size:15px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); }
  .progress-track{ height:3px; width:100%; background:var(--blue-line); border-radius:3px; margin-bottom:28px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--blue-mid),var(--blue-deep)); transition:width .35s ease; }
  .card{ background:var(--white); border:1px solid var(--blue-line); border-radius:14px; padding:36px 34px; box-shadow:0 20px 50px rgba(10,46,85,0.1); }
  .section-eyebrow{ font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--blue-mid); font-weight:600; margin-bottom:10px; }
  .qtext{ font-family:'Crimson Text',serif; font-size:23px; line-height:1.4; font-weight:600; color:var(--blue-deep); margin:0 0 6px 0; }
  .qsub{ font-size:12.5px; color:var(--muted); margin-bottom:22px; font-style:italic; }
  .intro-body{ font-size:15px; line-height:1.7; color:var(--ink); margin-bottom:16px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:9px; border:1px solid var(--blue-line); background:var(--white); cursor:pointer; transition:all .15s ease; font-size:15px; line-height:1.45; color:var(--ink); }
  .opt:hover{ border-color:var(--blue-mid); background:var(--blue-soft); }
  .opt.selected{ border-color:var(--blue); background:var(--blue-soft); }
  .opt .marker{ flex:0 0 auto; width:18px;height:18px; border-radius:4px; border:1.5px solid var(--blue-line); margin-top:2px; display:flex;align-items:center;justify-content:center; }
  .opt.radio .marker{ border-radius:50%; }
  .opt.selected .marker{ border-color:var(--blue); background:var(--blue); }
  .opt.selected .marker::after{ content:''; width:8px;height:8px; background:var(--white); border-radius:2px; }
  .opt.radio.selected .marker::after{ border-radius:50%; }
  .other-input{ margin-top:6px; width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--blue-line); background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; }
  .text-input{ width:100%; padding:13px 14px; border-radius:9px; border:1px solid var(--blue-line); background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; }
  .grid-row-label{ font-size:14.5px; color:var(--blue-deep); margin-bottom:8px; font-weight:600; }
  .grid-row-sub{ font-size:12.5px; color:var(--muted); margin-bottom:10px; font-weight:400; }
  .grid-scale{ display:flex; gap:8px; }
  .scale-btn{ width:100%; padding:10px 4px; border-radius:7px; border:1px solid var(--blue-line); background:var(--white); color:var(--ink); cursor:pointer; font-size:13px; text-align:center; }
  .scale-btn.selected{ border-color:var(--blue); background:var(--blue-soft); color:var(--blue-deep); font-weight:600; }
  .scale-legend{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
  .attr-progress{ font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:0.04em; }
  .imgbox{ border:1px dashed var(--blue-line); border-radius:10px; height:130px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; margin-bottom:14px; background:var(--paper); }
  .rank-item{ display:flex; align-items:center; justify-content:space-between; border:1px solid var(--blue-line); border-radius:9px; padding:12px 16px; margin-bottom:8px; background:var(--white); }
  .rank-item .n{ font-family:'Crimson Text',serif; font-weight:700; color:var(--blue); width:22px; }
  .rank-item .txt{ flex:1; padding:0 10px; font-size:14.5px; }
  .rank-item .arrows button{ background:var(--blue-soft); color:var(--blue); border:none; border-radius:6px; padding:5px 9px; font-size:12px; cursor:pointer; margin-left:4px; }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:28px; }
  .btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:12px 26px; border-radius:8px; border:none; cursor:pointer; transition:all .15s ease; }
  .btn-primary{ background:linear-gradient(120deg,var(--blue-mid),var(--blue-deep)); color:var(--white); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; filter:none; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--blue-line); }
  .btn-ghost:hover{ color:var(--blue-deep); border-color:var(--blue-mid); }
  .error-msg{ color:var(--danger); font-size:13px; margin-top:10px; }
  .end-screen{ text-align:center; padding:20px 0; }
  .end-screen h2{ font-family:'Crimson Text',serif; font-size:26px; margin-bottom:12px; color:var(--blue-deep); }
  .end-screen p{ font-size:15px; color:var(--ink); line-height:1.6; }
  .footer-note{ text-align:center; font-size:11px; color:var(--muted); margin-top:18px; }
  @media (max-width:520px){
    .card{ padding:26px 20px; }
    .qtext{ font-size:20px; }
    .grid-scale{ gap:4px; }
    .scale-btn{ font-size:11px; padding:8px 2px; }
  }
</style>
</head>

let otherText = {};

function escapeHtml(str){
  if (str===undefined || str===null) return '';
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
}
function visibleQuestions(){ return QUESTIONS.filter(q=> !(q.skipIf && q.skipIf(answers))); }
function pipedOptions(sourceId){
  const sel = answers[sourceId] || [];
  const srcQ = QUESTIONS.find(q=>q.id===sourceId);
  return sel.map(v=>{
    if (otherText[sourceId] && (srcQ.options.find(o=>o.v===v)||{}).hasOther) return {v, t:otherText[sourceId]};
    return (srcQ.options||[]).find(o=>o.v===v);
  }).filter(Boolean);
}
function labelForValue(q, val){
  const opts = q.pipeFrom ? pipedOptions(q.pipeFrom) : q.options;
  const o = (opts||[]).find(o=>o.v===val);
  return o ? o.t : val;
}

const card = document.getElementById('card');
const progressFill = document.getElementById('progressFill');
const brandbar = document.getElementById('brandbar');
const progressTrack = document.querySelector('.progress-track');

function updateProgress(){
  const q = QUESTIONS[current];
  const isBookend = (q.type==='intro' && !q.inline) || q.type==='end';
  brandbar.style.display = isBookend ? 'flex' : 'none';
  progressTrack.style.display = isBookend ? 'none' : 'block';
  if (isBookend) return;
  const vis = visibleQuestions();
  const idx = vis.findIndex(x=>x.id===q.id);
  progressFill.style.width = Math.round(((idx+1)/vis.length)*100)+'%';
}

function scaleRow(name, scaleLabels, selectedVal, onSelect){
  let html = `<div class="grid-scale">`;
  for(let s=1;s<=5;s++){
    html += `<div class="scale-btn ${selectedVal===s?'selected':''}" onclick="${onSelect}(${s})">${s}</div>`;
  }
  html += `</div><div class="scale-legend"><span>${escapeHtml(scaleLabels.low)}</span><span>${escapeHtml(scaleLabels.high)}</span></div>`;
  return html;
}

function render(){
  const q = QUESTIONS[current];
  updateProgress();

  if (q.type==='intro' && !q.inline){
    card.innerHTML = `
      <div class="section-eyebrow">Survey introduction</div>
      <h1 class="qtext" style="font-size:27px;">${escapeHtml(q.title)}</h1>
      ${q.body.map(p=>`<div class="intro-body">${escapeHtml(p)}</div>`).join('')}
      <div class="nav-row" style="justify-content:flex-end;">
        <button class="btn btn-primary" onclick="goNext()">Begin survey</button>
      </div>`;
    return;
  }
  if (q.type==='end'){
    card.innerHTML = `
      <div class="end-screen">
        <h2>Thank you for your time</h2>
        <p>Your responses have been recorded. This research is being used to improve how technology suppliers communicate with mineral processing professionals.</p>
      </div>`;
    return;
  }

  let html = `<div class="section-eyebrow">${escapeHtml(q.section)}${q.sectionDesc? ' — '+escapeHtml(q.sectionDesc):''}</div>`;
  html += `<div class="qtext">${escapeHtml(q.title||q.text)}</div>`;
  if(q.sub) html += `<div class="qsub">${escapeHtml(q.sub)}</div>`;
  if(q.note) html += `<div class="qsub">${escapeHtml(q.note)}</div>`;

  if (q.type==='intro' && q.inline){
    html += q.body.map(p=>`<div class="intro-body">${escapeHtml(p)}</div>`).join('');
  }
  else if (q.type==='single' || q.type==='multi'){
    let opts = q.options;
    if (q.pipeFrom) opts = pipedOptions(q.pipeFrom);
    const selected = answers[q.id] || (q.type==='multi'? [] : null);
    html += `<div class="options">`;
    opts.forEach(o=>{
      const isSel = q.type==='multi' ? (selected||[]).includes(o.v) : selected===o.v;
      html += `<div class="opt ${q.type==='single'?'radio':''} ${isSel?'selected':''}" onclick="selectOption('${q.id}','${o.v}')">
        <div class="marker"></div>
        <div style="flex:1;">${escapeHtml(o.t)}${o.hasOther && isSel ? `<div><input type="text" class="other-input" placeholder="Please specify" value="${escapeHtml(otherText[q.id]||'')}" onclick="event.stopPropagation()" oninput="otherText['${q.id}']=this.value"/></div>`:''}</div>
      </div>`;
    });
    html += `</div>`;
  }
  else if (q.type==='scale'){
    const val = answers[q.id];
    html += scaleRow(q.id, q.scaleLabels, val, `(v)=>{answers['${q.id}']=v; render();}`);
  }
  else if (q.type==='gridscale'){
    const row = q.rows[gridSubIndex];
    const ans = answers[q.id] || {};
    html += `<div class="attr-progress">Statement ${gridSubIndex+1} of ${q.rows.length}</div>`;
    html += `<div class="grid-row-label" style="font-size:17px;">${escapeHtml(row.t)}</div>`;
    html += scaleRow(q.id, q.scaleLabels, ans[row.v], `(v)=>{selectGridScale('${q.id}','${row.v}',v);}`);
  }
  else if (q.type==='dualgrid'){
    const row = q.rows[gridSubIndex];
    const ans = answers[q.id] || {};
    html += `<div class="attr-progress">${q.hasImage?'Image':'Statement'} ${gridSubIndex+1} of ${q.rows.length}</div>`;
    if(q.hasImage) html += `<img src="${CREATIVE_IMAGES[row.v]}" alt="${escapeHtml(row.t)}" style="width:100%;border-radius:10px;margin-bottom:14px;display:block;">`;
    else html += `<div class="grid-row-label" style="font-size:16px;font-style:italic;">"${escapeHtml(row.t)}"</div>`;
    html += `<div class="grid-row-sub" style="margin-top:10px;">Clarity</div>`;
    html += scaleRow(q.id+'_c', q.scaleLabelsA, (ans[row.v]||{}).clarity, `(v)=>{selectDual('${q.id}','${row.v}','clarity',v);}`);
    html += `<div class="grid-row-sub" style="margin-top:14px;">Appeal</div>`;
    html += scaleRow(q.id+'_a', q.scaleLabelsB, (ans[row.v]||{}).appeal, `(v)=>{selectDual('${q.id}','${row.v}','appeal',v);}`);
  }
  else if (q.type==='rank'){
    if(!answers[q.id]) answers[q.id] = q.options.map(o=>o.v);
    const order = answers[q.id];
    html += `<div>` + order.map((v,i)=>{
      const o = q.options.find(x=>x.v===v);
      return `<div class="rank-item"><span class="n">${i+1}</span><span class="txt">${escapeHtml(o.t)}</span>
        <span class="arrows"><button onclick="rankMove('${q.id}',${i},-1)">▲</button><button onclick="rankMove('${q.id}',${i},1)">▼</button></span></div>`;
    }).join('') + `</div>`;
  }

  html += `<div class="error-msg" id="errMsg"></div>`;
  const showBack = !(current<=1 && gridSubIndex===0);
  html += `<div class="nav-row">
      <button class="btn btn-ghost" onclick="goBack()" ${showBack?'':'style="visibility:hidden"'}>Back</button>
      <button class="btn btn-primary" onclick="goNext()">Continue</button>
    </div>`;

  card.innerHTML = html;
}

function selectOption(qid, val){
  const q = QUESTIONS.find(x=>x.id===qid);
  if (q.type==='multi'){
    if(!answers[qid]) answers[qid]=[];
    const arr = answers[qid];
    const opt = q.options.find(o=>o.v===val);
    const i = arr.indexOf(val);
    if (i>-1){ arr.splice(i,1); }
    else if (opt && opt.exclusive){ arr.length=0; arr.push(val); }
    else {
      q.options.forEach(o=>{ if(o.exclusive){ const ei=arr.indexOf(o.v); if(ei>-1) arr.splice(ei,1); } });
      if(q.maxSelect && arr.length>=q.maxSelect) return;
      arr.push(val);
    }
  } else { answers[qid]=val; }
  render();
}
window.selectGridScale = function(qid,row,v){ if(!answers[qid]) answers[qid]={}; answers[qid][row]=v; render(); };
window.selectDual = function(qid,row,dim,v){ if(!answers[qid]) answers[qid]={}; if(!answers[qid][row]) answers[qid][row]={}; answers[qid][row][dim]=v; render(); };
window.rankMove = function(qid,i,dir){ const arr=answers[qid]; const j=i+dir; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; render(); };
window.selectOption = selectOption;

function currentAnswerValid(q){
  if (q.type==='intro' || q.type==='end') return true;
  if (q.type==='single'){
    if(!answers[q.id]) return false;
    const opts = q.pipeFrom ? pipedOptions(q.pipeFrom) : q.options;
    const o = opts.find(o=>o.v===answers[q.id]);
    if (o && o.hasOther && !(otherText[q.id]||'').trim()) return false;
    return true;
  }
  if (q.type==='multi'){
    if(!answers[q.id] || answers[q.id].length===0) return false;
    const hasOtherSelected = answers[q.id].some(v=>{ const o=q.options.find(o=>o.v===v); return o && o.hasOther; });
    if (hasOtherSelected && !(otherText[q.id]||'').trim()) return false;
    return true;
  }
  if (q.type==='scale') return !!answers[q.id];
  if (q.type==='gridscale'){
    const row = q.rows[gridSubIndex]; const ans = answers[q.id]||{};
    return ans[row.v]!==undefined;
  }
  if (q.type==='dualgrid'){
    const row = q.rows[gridSubIndex]; const ans = (answers[q.id]||{})[row.v]||{};
    return ans.clarity!==undefined && ans.appeal!==undefined;
  }
  if (q.type==='rank') return true;
  return true;
}

function terminate(reason){
  terminated = true; terminateReason = reason;
  brandbar.style.display='flex'; progressTrack.style.display='none';
  card.innerHTML = `<div class="end-screen"><h2>Thank you for your time</h2>
    <p>At this time, you don't qualify for this particular survey based on your responses.</p></div>`;
  lockThisRef();
  submitData('Disqualified', reason);
}
function checkDisqualifiers(q){
  if (q.type==='single' && q.options){
    const o = q.options.find(o=>o.v===answers[q.id]);
    if (o && o.disqualify) return `Disqualified at ${q.id}: ${o.t}`;
  }
  if (q.type==='multi' && q.options){
    const hit = (answers[q.id]||[]).map(v=>q.options.find(o=>o.v===v)).find(o=>o && o.disqualify);
    if (hit) return `Disqualified at ${q.id}: ${hit.t}`;
  }
  return null;
}
async function checkQuota(q){
  if (q.type!=='single') return null;
  const o = (q.options||[]).find(o=>o.v===answers[q.id]);
  if (!o || !o.quotaCheck) return null;
  try{
    const res = await fetch(SCRIPT_URL+'?action=checkQuota&key='+encodeURIComponent(q.id+'_'+o.quotaCheck));
    const data = await res.json();
    if (data.quotaFull) return 'Over quota: '+o.t+' (cap reached)';
  }catch(e){ /* fail open if backend unreachable */ }
  return null;
}

async function goNext(){
  const q = QUESTIONS[current];
  document.getElementById('errMsg') && (document.getElementById('errMsg').textContent='');

  if (!(q.type==='intro' && !q.inline) && q.type!=='end'){
    if(!currentAnswerValid(q)){
      const err = document.getElementById('errMsg');
      if (err) err.textContent = 'Please answer before continuing.';
      return;
    }
    const dqReason = checkDisqualifiers(q);
    if (dqReason){ terminate(dqReason); return; }
    const quotaReason = await checkQuota(q);
    if (quotaReason){ terminate(quotaReason); return; }
  }

  if ((q.type==='gridscale' || q.type==='dualgrid') && gridSubIndex < q.rows.length-1){
    gridSubIndex++; render(); return;
  }
  gridSubIndex = 0;

  let next = current+1;
  while(next < QUESTIONS.length){
    const nq = QUESTIONS[next];
    if (nq.skipIf && nq.skipIf(answers)){ next++; continue; }
    break;
  }
  current = next;

  if (QUESTIONS[current].type==='end'){ lockThisRef(); submitData('Complete'); }
  render();
}
function goBack(){
  const q = QUESTIONS[current];
  if ((q.type==='gridscale' || q.type==='dualgrid') && gridSubIndex > 0){ gridSubIndex--; render(); return; }
  let prev = current-1;
  while(prev>0){
    const pq = QUESTIONS[prev];
    if (pq.skipIf && pq.skipIf(answers)){ prev--; continue; }
    break;
  }
  current = prev;
  if (QUESTIONS[current].type==='gridscale' || QUESTIONS[current].type==='dualgrid'){
    gridSubIndex = QUESTIONS[current].rows.length-1;
  }
  render();
}

function flattenAnswersForSubmit(){
  const labels = {}; const values = {};
  QUESTIONS.forEach(q=>{
    if (!(q.id in answers)) return;
    if (q.type==='multi'){
      labels[q.id] = (answers[q.id]||[]).map(v=>labelForValue(q,v)).join('|');
      values[q.id] = (answers[q.id]||[]).join('|');
      if (otherText[q.id]){ labels[q.id+'_Other']=otherText[q.id]; values[q.id+'_Other']=otherText[q.id]; }
    } else if (q.type==='gridscale' || q.type==='scale'){
      labels[q.id+'_Grid'] = answers[q.id]; values[q.id+'_Grid'] = answers[q.id];
    } else if (q.type==='dualgrid'){
      labels[q.id+'_Grid'] = answers[q.id]; values[q.id+'_Grid'] = answers[q.id];
    } else if (q.type==='rank'){
      labels[q.id+'_Rank'] = answers[q.id].map(v=>labelForValue({options:q.options},v)).join('>');
      values[q.id+'_Rank'] = answers[q.id].join('>');
    } else {
      labels[q.id] = labelForValue(q, answers[q.id]);
      values[q.id] = answers[q.id];
      if (otherText[q.id]){ labels[q.id+'_Other']=otherText[q.id]; values[q.id+'_Other']=otherText[q.id]; }
    }
  });
  return {labels, values};
}
function submitData(status, reason){
  const flat = flattenAnswersForSubmit();
  const payload = { status, reason: reason||'', ref: REF, lastQuestion: QUESTIONS[current].id, answersLabels: flat.labels, answersValues: flat.values };
  try{ fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify(payload)}); }catch(e){ /* non-blocking */ }
}

/* ======================= ONE-TIME-USE LINK LOCK ======================= */
function localLockKey(){ return 'metoptima_used_' + REF; }
function lockThisRef(){ if (!REF) return; try{ localStorage.setItem(localLockKey(), '1'); }catch(e){} }
function showAlreadyUsedScreen(){
  brandbar.style.display='flex'; progressTrack.style.display='none';
  card.innerHTML = `<div class="end-screen"><h2>This link has already been used</h2>
    <p>Our records show this survey link has already been completed. Each link is unique to one respondent, so it can only be submitted once. If you believe this is a mistake, please get in touch with the team that sent you this link.</p></div>`;
}
async function isLinkAlreadyUsed(){
  if (!REF) return false;
  try{ if (localStorage.getItem(localLockKey())==='1') return true; }catch(e){}
  try{
    const res = await fetch(SCRIPT_URL+'?action=checkLock&ref='+encodeURIComponent(REF));
    const data = await res.json();
    if (data.locked){ lockThisRef(); return true; }
  }catch(e){ /* fail open if backend unreachable */ }
  return false;
}
async function init(){
  const used = await isLinkAlreadyUsed();
  if (used){ showAlreadyUsedScreen(); return; }
  try{ fetch(SCRIPT_URL+'?action=start'); }catch(e){}
  render();
}
init();
</script>
